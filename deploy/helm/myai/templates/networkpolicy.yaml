{{/*
=============================================================================
NetworkPolicy - Default Deny + Allow Rules
============================================================================
Default deny all ingress/egress, then allow specific service-to-service communication.
*/}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myai.fullname" . }}-default-deny
  labels:
    {{- include "myai.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "myai.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
---
{{- range $serviceName, $serviceConfig := .Values.services }}
{{- if $serviceConfig.enabled }}
{{- if and ($serviceConfig.ports.http) (gt ($serviceConfig.ports.http | int) 0) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myai.fullname" (dict "Values" $.Values "serviceName" $serviceName "componentName" $serviceConfig.name "Chart" $.Chart "Release" $.Release) }}-allow
  labels:
    {{- include "myai.labels" (dict "Values" $.Values "serviceName" $serviceName "Chart" $.Chart "Release" $.Release) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "myai.selectorLabels" (dict "Values" $.Values "serviceName" $serviceName "Chart" $.Chart "Release" $.Release) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api-gateway
      ports:
        - port: {{ $serviceConfig.ports.http }}
          protocol: TCP
        {{- if and ($serviceConfig.ports.grpc) (gt ($serviceConfig.ports.grpc | int) 0) }}
        - port: {{ $serviceConfig.ports.grpc }}
          protocol: TCP
        {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/monitoring: "true"
      ports:
        - port: {{ $serviceConfig.ports.http }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
{{- end }}
{{- end }}
