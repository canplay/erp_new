name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cd Backend && cargo fmt -- --check
      - name: Clippy
        run: cd Backend && cargo clippy --workspace -- -D warnings
      - name: Compile
        run: cd Backend && cargo check --workspace
      - name: Test
        run: cd Backend && cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: Frontend/pnpm-lock.yaml
      - name: Install
        run: cd Frontend && pnpm install --frozen-lockfile
      - name: Type check (admin)
        run: cd Frontend/apps/admin && npx vue-tsc --noEmit
      - name: Build (admin)
        run: cd Frontend/apps/admin && npx quasar build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: |
          helm lint ./deploy/helm/myai/
          helm lint ./deploy/helm/myai/ -f ./deploy/helm/myai/values-prod.yaml
