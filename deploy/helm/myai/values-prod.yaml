# =============================================================================
# erp_new Helm Chart — 生产环境配置
# =============================================================================
# 用法:
#   helm install myai ./helm/myai -f ./helm/myai/values-prod.yaml
# =============================================================================

global:
  imageRegistry: "harbor.example.com:8003/erp"
  imagePullSecrets:
    - name: harbor-secret
  envPrefix: ""
  timezone: Asia/Shanghai

image:
  repository: erp-new-backend
  tag: "20260915.1"
  pullPolicy: IfNotPresent

replicaCount:
  apiGateway: 3
  authService: 3
  userService: 2
  cmsService: 2
  messageService: 2
  fileService: 2
  tenantService: 2
  workflowService: 2
  feedbackService: 1
  auditService: 2
  apiKeyService: 1
  hikService: 1
  payService: 2
  cleanService: 1
  towService: 1
  ctpService: 1
  xltService: 1
  ebikeService: 1
  lprService: 1
  socialOpsService: 1
  browserService: 1
  billingService: 2
  admin: 2

resources:
  apiGateway:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  authService:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  userService:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  default:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

services:
  apiGateway:
    env:
      CORS_ALLOWED_ORIGINS: "https://admin.example.com,https://api.example.com"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With"
      CORS_MAX_AGE: 3600

  fileService:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: ""

  admin:
    env:
      VITE_API_BASE_URL: "https://api.example.com/api"

ingress:
  enabled: true
  className: traefik
  baseDomain: "example.com"
  tlsSecretName: tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: admin.example.com
      paths:
        - path: /
          pathType: Prefix
          service: erp-new-admin
          port: 80
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 8090
  tls:
    - hosts:
        - "*.example.com"
      secretName: tls
  sslipPorts: {}

configMap:
  logging:
    RUST_LOG: info
    LOG_FORMAT: json
    LOG_MAX_SIZE: "500"
    LOG_MAX_FILES: "14"
  otel:
    OTEL_ENABLED: "true"
    OTEL_SERVICE_NAME: erp-new-backend-prod
  databasePool:
    maxConnections: "5"
    minConnections: "2"
    connectTimeout: "30"
    idleTimeout: "300"
    maxLifetime: "1800"

secret:
  database:
    POSTGRES_PASSWORD: "CHANGE-ME-MANAGED-EXTERNALLY"
    DATABASE_URL: "postgresql://postgres:***@pg-cluster:5432/erp_new"
  redis:
    REDIS_URL: "redis://default:***@redis-cluster:6379/0"
  jwt:
    JWT_SECRET: "CHANGE-ME-MANAGED-EXTERNALLY"
    JWT_ISSUER: "erp-new"
    JWT_AUDIENCE: "erp-new-users"
    JWT_ACCESS_EXPIRY: "900"
    GRPC_AUTH_TOKEN: "CHANGE-ME-MANAGED-EXTERNALLY"

infrastructure:
  postgres:
    enabled: false
  redis:
    enabled: false

serviceAccount:
  create: false
  annotations: {}
  name: ""

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - myai
          topologyKey: kubernetes.io/hostname

monitoring:
  enabled: true
  scrapeInterval: "30s"
  scrapeTimeout: "10s"

otel:
  enabled: true
  exporterOtlpEndpoint: "http://jaeger-collector:4317"
  serviceName: erp-new-backend-prod

logging:
  level: info
  format: json
  maxSize: 500
  maxFiles: 14
