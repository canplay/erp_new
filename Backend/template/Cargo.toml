[package]
name = "template"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
rand = "0.10.2"
chrono = "0.4.45"
reqwest = "0.13.4"
hex = "0.4.3"
bytes = "1.12.1"
uuid = "1.24.0"
base64 = "0.23.0"
urlencoding = "2.1.3"
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "tls-native-tls", "postgres", "mysql", "derive", "macros", "uuid", "chrono", "json" ] }
