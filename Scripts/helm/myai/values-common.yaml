# =============================================================================
# MyAI Helm Chart — 全局/通用配置
# =============================================================================
# 包含: global, image, logging, otel, nodeSelector, tolerations,
#                     affinity, serviceAccount, podSecurityContext, securityContext
# =============================================================================

# =============================================================================
# 全局配置
# =============================================================================
global:
  # 镜像仓库配置
  imageRegistry: ""
  imagePullSecrets: []
  # 环境变量前缀
  envPrefix: ""
  # 时区
  timezone: Asia/Shanghai

# =============================================================================
# 镜像配置
# =============================================================================
image:
  # 镜像仓库地址（需要替换为实际的镜像仓库）
  repository: myai-backend
  tag: "20260730.1"
  pullPolicy: IfNotPresent

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: info
  format: json
  maxSize: 100
  maxFiles: 7

# =============================================================================
# OpenTelemetry 配置
# =============================================================================
otel:
  enabled: false
  exporterOtlpEndpoint: ""
  serviceName: myai-backend

# =============================================================================
# NodeSelector 和 Tolerations
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  name: myai-service-account
  annotations: {}

# =============================================================================
# Pod Security Context
# =============================================================================
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1000

# =============================================================================
# Container Security Context
# =============================================================================
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL
