// ebike.proto — 电动自行车管理服务 (E-Bike Service)
// 提供用户认证、车辆管理、订单管理、仓储管理和系统配置功能

syntax = "proto3";

package ebike;

service EbikeService {
    // ========== 用户认证 ==========
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc GetUserInfo(GetUserInfoRequest) returns (UserInfo);
    rpc Logout(Empty) returns (GenericResponse);

    // ========== 车辆管理 ==========
    rpc CarAdd(CarAddRequest) returns (GenericResponse);
    rpc CarBatchAdd(CarBatchAddRequest) returns (GenericResponse);
    rpc CarDelete(CarDeleteRequest) returns (GenericResponse);
    rpc CarQuery(CarQueryRequest) returns (CarListResponse);
    rpc CarHistory(CarHistoryRequest) returns (CarListResponse);
    rpc CarAlert(CarAlertRequest) returns (CarListResponse);

    // ========== 订单管理 ==========
    rpc OrderQuery(OrderQueryRequest) returns (OrderListResponse);
    rpc OrderBatchAdd(OrderBatchAddRequest) returns (GenericResponse);
    rpc OrderAdd(OrderAddRequest) returns (OrderAddResponse);

    // ========== 仓储管理 ==========
    rpc StorageAdd(StorageAddRequest) returns (GenericResponse);
    rpc StorageBatchAdd(StorageBatchAddRequest) returns (GenericResponse);
    rpc StorageDelete(StorageDeleteRequest) returns (GenericResponse);
    rpc StorageQuery(StorageQueryRequest) returns (StorageListResponse);
    rpc StorageHistory(StorageHistoryRequest) returns (StorageListResponse);

    // ========== 系统配置 ==========
    rpc OptionsQuery(Empty) returns (OptionsInfo);
    rpc OptionsUpdate(OptionsUpdateRequest) returns (GenericResponse);
}

// ========== 通用类型 ==========

message Empty {
}

message GenericResponse {
    int32 code = 1;
    string message = 2;
    string data = 3;
}

// ========== 用户认证 ==========

message LoginRequest {
    string username = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1;
    UserBrief user = 2;
}

message UserBrief {
    int64 id = 1;
    string username = 2;
    string nickname = 3;
    string avatar = 4;
    string role = 5;
}

message GetUserInfoRequest {
    int64 user_id = 1;
}

message UserInfo {
    int64 id = 1;
    string username = 2;
    string nickname = 3;
    string avatar = 4;
    string phone = 5;
    string email = 6;
    int32 gender = 7;
    string address = 8;
    string role = 9;
    int32 status = 10;
}

// ========== 车辆管理 ==========

message GpsInfo {
    string lng = 1;
    string lat = 2;
}

message TimeRange {
    string start = 1;
    string end = 2;
}

message CarAddRequest {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    double speed = 4;
    GpsInfo gps = 5;
    int64 gps_type = 6;
    TimeRange time = 7;
    string alert = 8;
    string remark = 9;
}

message CarBatchAddRequest {
    repeated CarAddRequest items = 1;
}

message CarDeleteRequest {
    string code = 1;
    string provide = 2;
}

message CarQueryRequest {
    string code = 1;
    string provide = 2;
    int64 status = 3;
    string time_start = 4;
    string time_end = 5;
}

message CarHistoryRequest {
    string code = 1;
}

message CarAlertRequest {
    string code = 1;
    string provide = 2;
    int64 status = 3;
    string time = 4;
    string alert = 5;
    string remark = 6;
}

message CarInfo {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    double speed = 4;
    string gps_json = 5;
    int64 type = 6;
    string time_json = 7;
    string create_date = 8;
    string update_date = 9;
    bool delete = 10;
    string alert = 11;
    string remark = 12;
    int64 gps_type = 13;
}

message CarListResponse {
    repeated CarInfo cars = 1;
}

// ========== 订单管理 ==========

message OrderQueryRequest {
    string code = 1;
    string provide = 2;
    int64 status = 3;
    string time_start = 4;
    string time_end = 5;
    string order = 6;
    int64 paystatus = 7;
    int64 paytype = 8;
    string paytime = 9;
}

message OrderBatchAddRequest {
    repeated OrderAddRequest items = 1;
}

message OrderAddRequest {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    double speed = 4;
    GpsInfo gps = 5;
    int64 gps_type = 6;
    TimeRange time = 7;
    double payable = 8;
    double pay = 9;
    double refund = 10;
    double coupon = 11;
    string order = 12;
    int64 pay_type = 13;
    string pay_time = 14;
    int64 pay_status = 15;
    string alert = 16;
    string remark = 17;
}

message OrderAddResponse {
    string hash = 1;
}

message OrderInfo {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    double speed = 4;
    string gps_json = 5;
    int64 type = 6;
    string time_json = 7;
    string create_date = 8;
    string update_date = 9;
    bool delete = 10;
    string alert = 11;
    string remark = 12;
    string hash = 13;
    double payable = 14;
    double pay = 15;
    double refund = 16;
    double coupon = 17;
    string order = 18;
    int64 pay_type = 19;
    string pay_time = 20;
    int64 pay_status = 21;
    int64 gps_type = 22;
}

message OrderListResponse {
    repeated OrderInfo orders = 1;
}

// ========== 仓储管理 ==========

message StorageAddRequest {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    GpsInfo gps = 4;
    int64 gps_type = 5;
    int64 sum = 6;
    int64 cur = 7;
    string alert = 8;
    string remark = 9;
    string points = 10;
}

message StorageBatchAddRequest {
    repeated StorageAddRequest items = 1;
}

message StorageDeleteRequest {
    string code = 1;
}

message StorageQueryRequest {
    string code = 1;
    string provide = 2;
    int64 status = 3;
}

message StorageHistoryRequest {
    string code = 1;
}

message StorageInfo {
    string code = 1;
    int64 status = 2;
    string provide = 3;
    string gps_json = 4;
    int64 type = 5;
    int64 sum = 6;
    int64 cur = 7;
    string create_date = 8;
    string update_date = 9;
    bool delete = 10;
    string alert = 11;
    string remark = 12;
    string points = 13;
    int64 gps_type = 14;
}

message StorageListResponse {
    repeated StorageInfo storages = 1;
}

// ========== 系统配置 ==========

message OptionsUpdateRequest {
    string name = 1;
    int64 system = 2;
    int64 alert = 3;
    int64 level = 4;
}

message OptionsInfo {
    string name = 1;
    string options_json = 2;
    int64 level = 3;
    string create_date = 4;
    string update_date = 5;
    bool delete = 6;
}
