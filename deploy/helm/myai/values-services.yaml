# =============================================================================
# MyAI Helm Chart — 服务定义配置
# =============================================================================
# 包含: replicaCount, resources, services, ingress,
#                     configMap, secret
# =============================================================================

# =============================================================================
# 副本数配置
# =============================================================================
replicaCount:
  apiGateway: 2
  authService: 2
  userService: 2
  cmsService: 1
  messageService: 1
  fileService: 1
  tenantService: 1
  workflowService: 1
  feedbackService: 1
  auditService: 1
  apiKeyService: 1
  hikService: 1
  payService: 1
  cleanService: 1
  towService: 1
  ctpService: 1
  xltService: 1
  ebikeService: 1
  browserService: 1
  lprService: 1
  socialOpsService: 1
  admin: 1

# =============================================================================
# 资源限制配置
# =============================================================================
resources:
  # API Gateway
  apiGateway:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 认证服务
  authService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 用户服务
  userService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # 其他服务默认配置
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 电动车服务
  ebikeService:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 浏览器服务
  browserService:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # LPR 服务
  lprService:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 社交运营服务
  socialOpsService:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # 前端
  admin:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# =============================================================================
# 服务配置
# =============================================================================
services:
  # API Gateway（对外暴露）
  apiGateway:
    tag: "20260824141000"
    enabled: true
    name: api-gateway
    imageName: myai-api-gateway
    containerName: api-gateway
    ports:
      grpc: 9090
      http: 8090
    env:
      SERVICE_PORT: 8090
      GRPC_PORT: 9090
      AUTH_SERVICE_GRPC_URL: myai-auth-service:9091
      USER_SERVICE_GRPC_URL: myai-user-service:9090
      CMS_SERVICE_GRPC_URL: myai-cms-service:9082
      MESSAGE_SERVICE_GRPC_URL: myai-messaging-service:9083
      FILE_SERVICE_GRPC_URL: myai-file-service:9092
      TENANT_SERVICE_GRPC_URL: myai-tenant-service:9095
      WORKFLOW_SERVICE_GRPC_URL: myai-workflow-service:9088
      AUDIT_SERVICE_GRPC_URL: myai-audit-service:9010
      API_KEY_SERVICE_GRPC_URL: myai-api-key-service:9014
      FEEDBACK_SERVICE_GRPC_URL: myai-feedback-service:9085
      HIK_SERVICE_GRPC_URL: myai-hik-service:9096
      PAY_SERVICE_GRPC_URL: myai-pay-service:9097
      CLEAN_SERVICE_GRPC_URL: myai-clean-service:9087
      TOW_SERVICE_GRPC_URL: myai-tow-service:9086
      RATE_LIMIT_MAX: "100"
      RATE_LIMIT_WINDOW: "60"
      RATE_LIMIT_BURST: "20"
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
      CIRCUIT_BREAKER_TIMEOUT_SECS: "60"
      CIRCUIT_BREAKER_HALF_OPEN_REQUESTS: "3"
      CORS_ALLOWED_ORIGINS: "http://localhost:8090,http://localhost:3000"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With"
      CORS_MAX_AGE: "3600"

  # 认证服务
  authService:
    tag: "202608142030"
    enabled: true
    name: auth-service
    imageName: myai-auth-service
    containerName: auth-service
    ports:
      grpc: 9091
      http: 8081
    env:
      SERVICE_PORT: 8081
      GRPC_PORT: 9091
      JWT_ISSUER: myai
      JWT_AUDIENCE: myai-users
      JWT_ACCESS_EXPIRY: "900"
      JWT_REFRESH_EXPIRY: "604800"
      SESSION_MAX_LOGINS: "5"
      SESSION_TIMEOUT_SECS: "1800"
      DEVICE_LIMIT: "3"
      PASSWORD_MIN_LENGTH: "8"
      LOGIN_MAX_ATTEMPTS: "5"
      LOGIN_LOCKOUT_SECS: "1800"

  # 用户服务
  userService:
    tag: "202608142030"
    enabled: true
    name: user-service
    imageName: myai-user-service
    containerName: user-service
    ports:
      grpc: 9090
      http: 8080
    env:
      SERVICE_PORT: 8080
      GRPC_PORT: 9090

  # 内容管理服务
  cmsService:
    tag: "202608142030"
    enabled: true
    name: cms-service
    imageName: myai-cms-service
    containerName: cms-service
    ports:
      grpc: 9082
      http: 8082
    env:
      SERVICE_PORT: 8082
      GRPC_PORT: 9082

  # 消息服务
  messageService:
    tag: "202608142030"
    enabled: true
    name: messaging-service
    imageName: myai-messaging-service
    containerName: messaging-service
    ports:
      grpc: 9083
      http: 8083
    env:
      SERVICE_PORT: 8083
      GRPC_PORT: 9083

  # 文件服务
  fileService:
    tag: "202608142030"
    enabled: true
    name: file-service
    imageName: myai-file-service
    containerName: file-service
    ports:
      grpc: 9092
      http: 8086
    env:
      SERVICE_PORT: 8086
      GRPC_PORT: 9092
      FILE_STORAGE_TYPE: local
      FILE_STORAGE_PATH: /data/files
      S3_ENDPOINT: ""
      S3_REGION: us-east-1
      S3_BUCKET: myai-files
      S3_USE_PATH_STYLE: "true"
      OSS_ENDPOINT: ""
      OSS_BUCKET: myai-files
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""

  # 租户服务
  tenantService:
    tag: "202608142030"
    enabled: true
    name: tenant-service
    imageName: myai-tenant-service
    containerName: tenant-service
    ports:
      grpc: 9095
      http: 8087
    env:
      SERVICE_PORT: 8087
      GRPC_PORT: 9095

  # 工作流服务
  workflowService:
    tag: "202608142030"
    enabled: true
    name: workflow-service
    imageName: myai-workflow-service
    containerName: workflow-service
    ports:
      grpc: 9088
      http: 8088
    env:
      SERVICE_PORT: 8088
      GRPC_PORT: 9088
      WORKFLOW_SCRIPT_ENABLED: "true"
      WORKFLOW_SCRIPT_TIMEOUT_SECS: "30"
      WORKFLOW_MAX_EXECUTION_TIME_SECS: "3600"
      WORKFLOW_CRON_CHECK_INTERVAL_SECS: "60"

  # 反馈服务
  feedbackService:
    tag: "202608142030"
    enabled: true
    name: feedback-service
    imageName: myai-feedback-service
    containerName: feedback-service
    ports:
      grpc: 9085
      http: 8085
    env:
      SERVICE_PORT: 8085
      GRPC_PORT: 9085

  # 审计服务
  auditService:
    tag: "202608142030"
    enabled: true
    name: audit-service
    imageName: myai-audit-service
    containerName: audit-service
    ports:
      grpc: 9010
      http: 8089
    env:
      SERVICE_PORT: 8089
      GRPC_PORT: 9010

  # API Key 服务
  apiKeyService:
    tag: "202608142030"
    enabled: true
    name: api-key-service
    imageName: myai-api-key-service
    containerName: api-key-service
    ports:
      grpc: 9014
      http: 8091
    env:
      SERVICE_PORT: 8091
      GRPC_PORT: 9014

  # 海康服务
  hikService:
    tag: "202608142030"
    enabled: true
    name: hik-service
    imageName: myai-hik-service
    containerName: hik-service
    ports:
      grpc: 9096
      http: 8092
    env:
      SERVICE_PORT: 8092
      GRPC_PORT: 9096

  # 支付服务
  payService:
    tag: "202608142030"
    enabled: true
    name: pay-service
    imageName: myai-pay-service
    containerName: pay-service
    ports:
      grpc: 9097
      http: 8093
    env:
      SERVICE_PORT: 8093
      GRPC_PORT: 9097
      PAY_ENV: sandbox
      CCB_SIGN_TYPE: RSA
      UMS_SIGN_TYPE: RSA

  # 清洁服务
  cleanService:
    tag: "202608142030"
    enabled: true
    name: clean-service
    imageName: myai-clean-service
    containerName: clean-service
    ports:
      grpc: 9087
      http: 8095
    env:
      SERVICE_PORT: 8095
      GRPC_PORT: 9087

  # 拖车服务
  towService:
    tag: "202608142030"
    enabled: true
    name: tow-service
    imageName: myai-tow-service
    containerName: tow-service
    ports:
      grpc: 9086
      http: 8094
    env:
      SERVICE_PORT: 8094
      GRPC_PORT: 9086

  # CTP 服务
  ctpService:
    tag: "202608142030"
    enabled: true
    name: ctp-service
    imageName: myai-ctp-service
    containerName: ctp-service
    ports:
      grpc: 9098
      http: 8096
    env:
      SERVICE_PORT: 8096
      GRPC_PORT: 9098

  # XLT 服务
  xltService:
    tag: "202608142030"
    enabled: true
    name: xlt-service
    imageName: myai-xlt-service
    containerName: xlt-service
    ports:
      grpc: 9099
      http: 8097
    env:
      SERVICE_PORT: 8097
      GRPC_PORT: 9099

  # 电动车服务
  ebikeService:
    tag: "202608142030"
    enabled: true
    name: ebike-service
    imageName: myai-ebike-service
    containerName: ebike-service
    ports:
      grpc: 9100
      http: 8098
    env:
      SERVICE_PORT: 8098
      GRPC_PORT: 9100

  # 浏览器服务
  browserService:
    tag: "202608142030"
    enabled: true
    name: browser-service
    imageName: myai-browser-service
    containerName: browser-service
    ports:
      grpc: 9101
      http: 8120
    env:
      SERVICE_PORT: 8120
      GRPC_PORT: 9101

  # LPR 服务
  lprService:
    tag: "202608142030"
    enabled: true
    name: lpr-service
    imageName: myai-lpr-service
    containerName: lpr-service
    ports:
      grpc: 9102
      http: 8130
    env:
      SERVICE_PORT: 8130
      GRPC_PORT: 9102

  # 社交运营服务
  socialOpsService:
    tag: "202608142030"
    enabled: true
    name: social-ops-service
    imageName: myai-social-ops-service
    containerName: social-ops-service
    ports:
      grpc: 9103
      http: 8110
    env:
      SERVICE_PORT: 8110
      GRPC_PORT: 9103

  # 前端管理后台
  admin:
    tag: "20260824124711"
    enabled: true
    name: myai-admin
    imageName: myai-admin
    containerName: myai-admin
    ports:
      http: 80
    service:
      type: NodePort
      ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
    env: {}

# =============================================================================
# Ingress 配置（支持 example.com 域名 + 端口路由）
# =============================================================================
ingress:
  enabled: false
  className: nginx
  baseDomain: "100.100.100.100.example.com"
  tlsSecretName: tls
  annotations: {}
  hosts:
    - host: myai-backend.local
      paths:
        - path: /
          pathType: Prefix
          service: myai-api-gateway
          port: 8090
  tls: []

  # example.com 端口路由 (8000-8999)
  sslipPorts: {}

# =============================================================================
# ConfigMap 配置（非敏感配置）
# =============================================================================
configMap:
  # 日志配置
  logging:
    RUST_LOG: info
    LOG_FORMAT: json
    LOG_MAX_SIZE: "100"
    LOG_MAX_FILES: "7"
  # OpenTelemetry
  otel:
    OTEL_ENABLED: "false"
    OTEL_SERVICE_NAME: myai-backend
  # 数据库连接池（共享同一 PG，控制单服务连接数）
  databasePool:
    maxConnections: "3"
    minConnections: "1"
    connectTimeout: "30"
    idleTimeout: "300"
    maxLifetime: "1800"
