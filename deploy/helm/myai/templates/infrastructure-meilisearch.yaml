{{/* Meilisearch 全文搜索服务 */}}
{{- if .Values.infrastructure.meilisearch.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erp-new-meilisearch
  labels:
    app: meilisearch
    {{- include "erpnew.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meilisearch
  template:
    metadata:
      labels:
        app: meilisearch
        {{- include "erpnew.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: meilisearch
          image: meilisearch:latest
          ports:
            - containerPort: 7700
          env:
            - name: MEILI_ENV
              value: {{ .Values.infrastructure.meilisearch.env.MEILI_ENV | quote }}
            - name: MEILI_EXPERIMENTAL_REPLICATION
              value: {{ .Values.infrastructure.meilisearch.env.MEILI_EXPERIMENTAL_REPLICATION | quote }}
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "erpnew.fullchartname" . }}-secret
                  key: MEILI_MASTER_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: meili-data
              mountPath: /meili_data
      volumes:
        - name: meili-data
          persistentVolumeClaim:
            claimName: erp-new-meilisearch-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  labels:
    app: meilisearch
    {{- include "erpnew.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: meilisearch
  ports:
    - name: http
      port: 7700
      targetPort: 7700
      protocol: TCP
{{- end }}
