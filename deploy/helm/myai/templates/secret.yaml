{{/*
=============================================================================
Secret 模板 - 敏感配置
=============================================================================
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "erpnew.fullchartname" . }}-secret
  labels:
    {{- include "erpnew.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 数据库配置
  POSTGRES_PASSWORD: {{ .Values.secret.database.POSTGRES_PASSWORD | quote }}
  DATABASE_URL: {{ .Values.secret.database.DATABASE_URL | quote }}
  
  # Redis 配置
  REDIS_URL: {{ .Values.secret.redis.REDIS_URL | quote }}
  
  # JWT 配置
  JWT_SECRET: {{ .Values.secret.jwt.JWT_SECRET | quote }}
  JWT_ISSUER: {{ .Values.secret.jwt.JWT_ISSUER | quote }}
  JWT_AUDIENCE: {{ .Values.secret.jwt.JWT_AUDIENCE | quote }}
  JWT_ACCESS_EXPIRY: {{ .Values.secret.jwt.JWT_ACCESS_EXPIRY | quote }}
  # gRPC 服务间鉴权共享令牌
  GRPC_AUTH_TOKEN: {{ .Values.secret.jwt.GRPC_AUTH_TOKEN | quote }}
  
  # S3 配置
  S3_ACCESS_KEY: {{ .Values.secret.s3.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secret.s3.S3_SECRET_KEY | quote }}
  
  # OSS 配置
  OSS_ACCESS_KEY_ID: {{ .Values.secret.oss.OSS_ACCESS_KEY_ID | quote }}
  OSS_ACCESS_KEY_SECRET: {{ .Values.secret.oss.OSS_ACCESS_KEY_SECRET | quote }}
  
  # 海康配置
  HIK_URL: {{ .Values.secret.hik.HIK_URL | quote }}
  HIK_CLIENT_ID: {{ .Values.secret.hik.HIK_CLIENT_ID | quote }}
  HIK_CLIENT_SECRET: {{ .Values.secret.hik.HIK_CLIENT_SECRET | quote }}
  HIK_APP_KEY: {{ .Values.secret.hik.HIK_APP_KEY | quote }}
  HIK_APP_SECRET: {{ .Values.secret.hik.HIK_APP_SECRET | quote }}
  
  # 支付配置
  CCB_MERCHANT_ID: {{ .Values.secret.pay.CCB_MERCHANT_ID | quote }}
  CCB_MERCHANT_NAME: {{ .Values.secret.pay.CCB_MERCHANT_NAME | quote }}
  CCB_TERMINAL_ID: {{ .Values.secret.pay.CCB_TERMINAL_ID | quote }}
  CCB_KEY: {{ .Values.secret.pay.CCB_KEY | quote }}
  CCB_CERT: {{ .Values.secret.pay.CCB_CERT | quote }}
  CCB_GATEWAY_URL: {{ .Values.secret.pay.CCB_GATEWAY_URL | quote }}
  UMS_MERCHANT_ID: {{ .Values.secret.pay.UMS_MERCHANT_ID | quote }}
  UMS_TERMINAL_ID: {{ .Values.secret.pay.UMS_TERMINAL_ID | quote }}
  UMS_KEY: {{ .Values.secret.pay.UMS_KEY | quote }}
  UMS_GATEWAY_URL: {{ .Values.secret.pay.UMS_GATEWAY_URL | quote }}
  PAY_NOTIFY_URL: {{ .Values.secret.pay.PAY_NOTIFY_URL | quote }}
  PAY_RETURN_URL: {{ .Values.secret.pay.PAY_RETURN_URL | quote }}