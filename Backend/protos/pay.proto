// pay.proto — 支付服务 (Payment Service)
// 提供基础支付、建行(CCB)支付和银联(UMS)支付功能

syntax = "proto3";

package pay;

service PayService {
    // ========== 基础支付接口 ==========
    // 查询支付订单数量
    rpc Count(PayQuery) returns (CountResponse);
    // 查询支付订单列表
    rpc List(PayQuery) returns (OrderListResponse);
    // 查询最近已支付订单
    rpc Latest(LatestRequest) returns (PayOrderResponse);
    // 创建支付订单
    rpc CreateOrder(PayCreateParams) returns (PayOrderResponse);

    // ========== CCB 建行支付接口 ==========
    // CCB查询支付订单
    rpc CcbQuery(CcbQueryParams) returns (CcbQueryResponse);
    // CCB创建支付订单
    rpc CcbCreate(CcbOrderParams) returns (CcbOrderResponse);
    // CCB验证支付结果
    rpc CcbVerify(CcbVerifyRequest) returns (BoolResponse);
    // CCB退款
    rpc CcbRefund(CcbRefundRequest) returns (BoolResponse);

    // ========== UMS 银联支付接口 ==========
    // UMS查询支付订单
    rpc UmsQuery(UmsQueryParams) returns (JsonValueResponse);
    // UMS创建支付订单
    rpc UmsCreate(UmsOrderParams) returns (JsonValueResponse);
    // UMS关闭支付订单
    rpc UmsClose(UmsCloseParams) returns (JsonValueResponse);
    // UMS退款
    rpc UmsRefund(UmsRefundParams) returns (JsonValueResponse);
    // UMS获取订单信息
    rpc UmsInfo(UmsInfoRequest) returns (JsonValueResponse);
}

// ========== 订阅管理服务 ==========
service SubscriptionService {
    // 创建订阅
    rpc CreateSubscription(CreateSubscriptionRequest) returns (SubscriptionResponse);
    // 取消订阅
    rpc CancelSubscription(CancelSubscriptionRequest) returns (SubscriptionResponse);
    // 查询订阅
    rpc GetSubscription(GetSubscriptionRequest) returns (SubscriptionResponse);
    // 列出订阅
    rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
}

// ========== 订阅状态 ==========

enum SubscriptionStatus {
    SUBSCRIPTION_STATUS_UNSPECIFIED = 0;
    SUBSCRIPTION_STATUS_ACTIVE = 1;
    SUBSCRIPTION_STATUS_PAST_DUE = 2;
    SUBSCRIPTION_STATUS_CANCELED = 3;
    SUBSCRIPTION_STATUS_TRIALING = 4;
}

// ========== 订阅消息 ==========

message Subscription {
    int64 id = 1;
    int64 tenant_id = 2;
    string plan_id = 3;
    SubscriptionStatus status = 4;
    int64 current_period_start = 5;
    int64 current_period_end = 6;
    bool cancel_at_period_end = 7;
    string created_at = 8;
    string updated_at = 9;
}

message CreateSubscriptionRequest {
    int64 tenant_id = 1;
    string plan_id = 2;
    string payment_method_id = 3;
    int32 trial_days = 4;
}

message CancelSubscriptionRequest {
    int64 subscription_id = 1;
    bool immediate = 2;
}

message GetSubscriptionRequest {
    int64 subscription_id = 1;
}

message ListSubscriptionsRequest {
    int64 tenant_id = 1;
    string status = 2;
    int32 page = 3;
    int32 page_size = 4;
}

message SubscriptionResponse {
    Subscription subscription = 1;
    string message = 2;
}

message ListSubscriptionsResponse {
    repeated Subscription subscriptions = 1;
    int64 total = 2;
    string message = 3;
}

// ========== 订阅计划消息 ==========

message SubscriptionPlan {
    string id = 1;
    string name = 2;
    string description = 3;
    int64 price_cents = 4;
    string currency = 5;
    string interval = 6;
    int32 interval_count = 7;
    int32 trial_days = 8;
    bool active = 9;
}

message Invoice {
    int64 id = 1;
    int64 tenant_id = 2;
    int64 subscription_id = 3;
    string status = 4;
    int64 amount_cents = 5;
    string currency = 6;
    int64 period_start = 7;
    int64 period_end = 8;
    string created_at = 9;
    string updated_at = 10;
}

message InvoiceItem {
    int64 id = 1;
    int64 invoice_id = 2;
    string description = 3;
    int64 amount_cents = 4;
    int32 quantity = 5;
    string currency = 6;
}

// ========== 基础支付接口 ==========

message PayQuery {
    optional string status = 1;
    optional string pay_type = 2;
    optional string remark = 3;
    optional string sort_by = 4;
    optional bool descending = 5;
    optional int64 max_page = 6;
    optional int64 cur_page = 7;
}

message CountResponse {
    int64 count = 1;
    string message = 2;
}

message LatestRequest {
    string user_id = 1;
}

message PayOrder {
    string id = 1;
    string order = 2;
    string status = 3;
    string pay_type = 4;
    string order_pay_json = 5;
    int32 amount = 6;
    string remark = 7;
    string create_service = 8;
    string create_params_json = 9;
    string create_date = 10;
    string update_date = 11;
}

message PayOrderResponse {
    PayOrder order = 1;
    string message = 2;
}

message OrderListResponse {
    repeated PayOrder orders = 1;
    string message = 2;
}

message PayCreateParams {
    string order = 1;
    optional string status = 2;
    optional string pay_type = 3;
    optional string order_pay_json = 4;
    optional int32 amount = 5;
    optional string remark = 6;
    optional string create_params_json = 7;
    optional string create_date = 8;
}

// ========== CCB 建行支付接口 ==========

message CcbQueryParams {
    string order_id = 1;
}

message CcbQueryResponse {
    string data_json = 1;
}

message CcbOrderParams {
    string order_id = 1;
    int32 amount = 2;
    string subject = 3;
}

message CcbOrderResponse {
    string data_json = 1;
}

message CcbVerifyRequest {
    string order_id = 1;
}

message CcbRefundRequest {
    string order_id = 1;
    double amount = 2;
}

message BoolResponse {
    bool success = 1;
    string message = 2;
}

// ========== UMS 银联支付接口 ==========

message UmsQueryParams {
    string order_id = 1;
}

message UmsOrderParams {
    string order_id = 1;
    int32 amount = 2;
    string subject = 3;
    string description = 4;
}

message UmsCloseParams {
    string order_id = 1;
}

message UmsRefundParams {
    string order_id = 1;
    double amount = 2;
    string reason = 3;
}

message UmsInfoRequest {
    string order = 1;
}

message JsonValueResponse {
    string data_json = 1;
    string message = 2;
}
