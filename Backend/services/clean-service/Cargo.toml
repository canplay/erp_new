[package]
name = "clean-service"
version.workspace = true
edition.workspace = true

[dependencies]
tracing = "0.1"
tracing-subscriber.workspace = true
# 公共依赖
common = { workspace = true }
grpc-proto = { workspace = true }

# 异步运行时
tokio = { workspace = true }

# gRPC
tonic = { workspace = true }

# 数据库
sqlx = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 日志
log = { workspace = true }

# 错误处理
thiserror = { workspace = true }
anyhow = { workspace = true }

# axum（for error IntoResponse impl）
axum = { workspace = true }
    futures-util = "0.3"

# 日期时间
chrono = { workspace = true }

# UUID 生成
uuid = { workspace = true }
cache-core.workspace = true

[lib]
name = "clean_service"
path = "src/lib.rs"

[[bin]]
name = "clean-service"
path = "src/main.rs"
