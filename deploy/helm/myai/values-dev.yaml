# =============================================================================
# 开发环境配置
# =============================================================================

# 镜像配置
image:
  repository: myai-backend
  tag: "20260730.1"
  pullPolicy: Always

# 副本数配置（开发环境使用较少副本）
replicaCount:
  apiGateway: 1
  authService: 1
  userService: 1
  cmsService: 1
  messageService: 1
  fileService: 1
  tenantService: 1
  workflowService: 1
  feedbackService: 1
  auditService: 1
  apiKeyService: 1
  hikService: 1
  payService: 1
  cleanService: 1
  towService: 1
  ctpService: 1
  xltService: 1
  ebikeService: 1

# 资源限制配置（开发环境资源限制宽松）
resources:
  apiGateway:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  authService:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  userService:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  default:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# 日志配置（开发环境使用 debug 级别）
logging:
  level: debug
  format: json
  maxSize: 100
  maxFiles: 3

# ConfigMap 配置
configMap:
  logging:
    RUST_LOG: debug
    LOG_FORMAT: json
    LOG_MAX_SIZE: "100"
    LOG_MAX_FILES: "3"
  otel:
    OTEL_ENABLED: "false"
    OTEL_SERVICE_NAME: myai-backend-dev

# Ingress 配置（开发环境）
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: myai-backend-dev.local
      paths:
        - path: /
          pathType: Prefix

# 基础设施配置（开发环境使用较小的存储）
infrastructure:
  postgres:
    persistence:
      size: 5Gi
  redis:
    persistence:
      size: 2Gi

# 文件服务存储（开发环境）
services:
  fileService:
    persistence:
      size: 5Gi