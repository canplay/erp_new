// browser.proto -- 浏览器自动化服务
// 提供远程浏览器控制能力，包括页面导航、内容提取、元素交互、截图等
// 供内部微服务通过 gRPC 调用，实现自动化网页操作

syntax = "proto3";

package browser;

// 浏览器自动化服务 — 供内部微服务通过 gRPC 调用
// 控制无头浏览器实例，支持多标签页并发操作
service BrowserService {
    // 创建浏览器标签页，返回 session_id
    rpc OpenPage(OpenPageRequest) returns (OpenPageResponse);

    // 导航到 URL
    rpc Navigate(NavigateRequest) returns (NavigateResponse);

    // 获取页面纯文本
    rpc GetText(GetTextRequest) returns (GetTextResponse);

    // 获取页面 HTML
    rpc GetHtml(GetHtmlRequest) returns (GetHtmlResponse);

    // 获取页面标题
    rpc GetTitle(GetTitleRequest) returns (GetTitleResponse);

    // 点击元素
    rpc Click(ClickRequest) returns (ClickResponse);

    // 在元素中输入文本
    rpc Input(InputRequest) returns (InputResponse);

    // 注入 Cookie
    rpc SetCookies(SetCookiesRequest) returns (SetCookiesResponse);

    // 截图（返回 base64）
    rpc Screenshot(ScreenshotRequest) returns (ScreenshotResponse);

    // 获取页面元素信息
    rpc GetElements(GetElementsRequest) returns (GetElementsResponse);

    // 关闭浏览器标签页
    rpc ClosePage(ClosePageRequest) returns (ClosePageResponse);
}

// ===== 通用类型 =====

// 元素信息
// 描述页面中某个 DOM 元素的标签、文本和属性
message ElementInfo {
    string tag = 1;                          // HTML 标签名
    string text = 2;                         // 元素文本内容
    map<string, string> attributes = 3;      // 元素属性键值对
}

// Cookie 项
message CookieItem {
    string name = 1;                         // Cookie 名称
    string value = 2;                        // Cookie 值
    string domain = 3;                       // 所属域名
    optional string path = 4;                // 路径
}

// ===== OpenPage =====
// 创建浏览器标签页请求（无需参数）
message OpenPageRequest {}
// 创建浏览器标签页响应
message OpenPageResponse {
    string session_id = 1;                   // 新标签页的会话 ID
}

// ===== Navigate =====
// 导航到指定 URL 请求
message NavigateRequest {
    string session_id = 1;                   // 标签页会话 ID
    string url = 2;                          // 目标 URL
}
// 导航响应
message NavigateResponse {
    bool success = 1;                        // 是否导航成功
    string title = 2;                        // 导航完成后的页面标题
}

// ===== GetText =====
// 获取页面纯文本请求
message GetTextRequest {
    string session_id = 1;                   // 标签页会话 ID
}
// 获取页面纯文本响应
message GetTextResponse {
    string text = 1;                         // 页面纯文本内容
}

// ===== GetHtml =====
// 获取页面 HTML 请求
message GetHtmlRequest {
    string session_id = 1;                   // 标签页会话 ID
}
// 获取页面 HTML 响应
message GetHtmlResponse {
    string html = 1;                         // 页面 HTML 源代码
}

// ===== GetTitle =====
// 获取页面标题请求
message GetTitleRequest {
    string session_id = 1;                   // 标签页会话 ID
}
// 获取页面标题响应
message GetTitleResponse {
    string title = 1;                        // 页面标题
}

// ===== Click =====
// 点击元素请求
message ClickRequest {
    string session_id = 1;                   // 标签页会话 ID
    string selector = 2;                     // CSS 选择器
}
// 点击元素响应
message ClickResponse {
    bool success = 1;                        // 是否点击成功
}

// ===== Input =====
// 在元素中输入文本请求
message InputRequest {
    string session_id = 1;                   // 标签页会话 ID
    string selector = 2;                     // CSS 选择器
    string text = 3;                         // 要输入的文本
}
// 输入文本响应
message InputResponse {
    bool success = 1;                        // 是否输入成功
}

// ===== SetCookies =====
// 注入 Cookie 请求
message SetCookiesRequest {
    string session_id = 1;                   // 标签页会话 ID
    repeated CookieItem cookies = 2;         // 要注入的 Cookie 列表
}
// 注入 Cookie 响应
message SetCookiesResponse {
    bool success = 1;                        // 是否注入成功
    int32 count = 2;                         // 成功注入的 Cookie 数量
}

// ===== Screenshot =====
// 截图请求
message ScreenshotRequest {
    string session_id = 1;                   // 标签页会话 ID
    bool full_page = 2;                      // 是否截取全页（而非可视区域）
}
// 截图响应
message ScreenshotResponse {
    string image_base64 = 1;                 // 截图图片的 Base64 编码
}

// ===== GetElements =====
// 获取页面元素信息请求
message GetElementsRequest {
    string session_id = 1;                   // 标签页会话 ID
    string selector = 2;                     // CSS 选择器
}
// 获取页面元素信息响应
message GetElementsResponse {
    repeated ElementInfo elements = 1;       // 匹配的元素列表
    int32 count = 2;                         // 匹配元素数量
}

// ===== ClosePage =====
// 关闭浏览器标签页请求
message ClosePageRequest {
    string session_id = 1;                   // 要关闭的标签页会话 ID
}
// 关闭浏览器标签页响应
message ClosePageResponse {
    bool success = 1;                        // 是否关闭成功
}
