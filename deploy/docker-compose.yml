# erp_new 本地开发/调试编排（podman / docker 兼容）
#
# 用法：
#   podman compose -f deploy/docker-compose.yml up -d
#   # 或 docker compose -f deploy/docker-compose.yml up -d
#
# 依赖服务（本编排包含全部外部依赖）：
#   - postgres (数据库)
#   - redis (缓存)
#   - meilisearch (全文搜索，可选)
#   - paddlex-ocr (OCR 服务，可选)
#
# 网络访问（podman WSL 模式）：
#   - Windows localhost 端口转发不稳定，浏览器须用 WSL IP 访问
#   - 取 WSL IP: podman machine ssh -- ip -4 addr show eth0

x-common-env: &api-common
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/erp_new?sslmode=prefer
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: dev-jwt-secret-replace-in-production-min-32-chars
  JWT_ISSUER: erp_new
  JWT_AUDIENCE: erp_new
  JWT_EXPIRATION: "3600"
  JWT_REFRESH_EXPIRATION: "86400"
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_API_KEY: ""
  MEILISEARCH_INDEX_NAME: erp_new

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: erp_new-postgres
    environment:
      POSTGRES_DB: erp_new
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erp_new-pg-data:/var/lib/postgresql/data
      - ./Backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_new"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp_new-net]

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: erp_new-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp_new-net]

  meilisearch:
    image: docker.io/getmeili/meilisearch:v1.11
    container_name: erp_new-meili
    environment:
      MEILI_ENV: development
      MEILI_EXPERIMENTAL_REPLICATION: "false"
    ports:
      - "7700:7700"
    volumes:
      - erp_new-meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [erp_new-net]

  paddlex-ocr:
    image: registry.cn-shanghai.aliyuncs.com/publix/paddlex:ocr-3.0.0
    container_name: erp_new-ocr
    environment:
      PADDLEX_CONFIG: /app/config.yaml
    ports:
      - "8901:8080"
    volumes:
      - ./Backend/config/paddlex.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [erp_new-net]

volumes:
  erp_new-pg-data:
  erp_new-meili-data:

networks:
  erp_new-net:
    driver: bridge
