# =============================================================================
# 基础设施配置（暂不启用，使用外部 PostgreSQL/Redis）
# =============================================================================
infrastructure:
  postgres:
    enabled: false
  redis:
    enabled: false

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: info
  format: json
  maxSize: 100
  maxFiles: 7

# =============================================================================
# OpenTelemetry 配置（暂不启用）
# =============================================================================
otel:
  enabled: false
  exporterOtlpEndpoint: ""
  serviceName: myai-backend

# =============================================================================
# Ingress 配置（支持 example.com 域名 + 端口路由）
# =============================================================================
# example.com 域名说明:
#   - X-X-X-X.example.com 解析为 IP X.X.X.X
#   - 端口访问通过 service.X-X-X-X.example.com:N 或 ingress host + path 路由
#   - 本配置同时提供:
#     1. Host-based routing (推荐): admin.100.100.100.100.example.com:8900
#     2. Port-based routing: api-gateway.100.100.100.100.example.com:8900
ingress:
  enabled: true
  className: traefik
  baseDomain: "100.100.100.100.example.com"
  tlsSecretName: tls
  annotations:
    # 仅启用 HTTPS (websecure entrypoint → 8901)
    # 与 rancher/ceph 等其他 Ingress 一致：HTTP (8900) 返回 404，强制 HTTPS
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

  # Host-based routing (推荐方式)
  hosts:
    - host: admin.100.100.100.100.example.com
      paths:
        - path: /
          pathType: Prefix
          service: myai-admin
          port: 80
    - host: api.100.100.100.100.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
          port: 8090

  # Port-based routing (example.com 端口直连)
  # NOTE: example.com 的特殊性:
  #   - DNS 解析: X-X-X-X.example.com → X.X.X.X
  #   - 端口: 必须使用非标准端口 (8900-8999)
  #   - TLS: 需要通配符证书 *.106-60-80-54.example.com (当前为自签证书)
  #   - 浏览器访问: https://domain.example.com:port + 忽略证书警告
  #   - 生产环境建议: 使用标准域名 + CDN/WAF + 标准 443 端口
  # sslipPorts 已废弃 — 改用 host-based routing (推荐):
  #   admin.106-60-80-54.example.com:8900/8901
  #   api.106-60-80-54.example.com:8900/8901
  sslipPorts: {}
    # apiGateway:
    #   port: 8900
    #   description: "API Gateway - HTTP/GRPC"
    # myaiAdmin:
    #   port: 8901
    #   description: "Admin Frontend"

  tls:
    - hosts:
        - "*.100.100.100.100.example.com"
      secretName: tls

# =============================================================================
# ConfigMap 配置（非敏感配置）
# =============================================================================
configMap:
  logging:
    RUST_LOG: info
    LOG_FORMAT: json
    LOG_MAX_SIZE: "100"
    LOG_MAX_FILES: "7"
  otel:
    OTEL_ENABLED: "false"
    OTEL_SERVICE_NAME: myai-backend
  # 数据库连接池（22个服务共享同一 PG，必须控制单服务连接数）
  databasePool:
    maxConnections: "3"
    minConnections: "1"
    connectTimeout: "30"
    idleTimeout: "300"
    maxLifetime: "1800"

# =============================================================================
# Secret 配置（敏感配置）
# 注意: 此文件可能用于参考，实际敏感信息应放在独立的 secrets.yaml 中
# =============================================================================
secret:
  database:
    # 安全加固: 真实密码由外部管理(kubectl patch 注入, 见 deploy/scripts/apply-secrets.sh)
    POSTGRES_PASSWORD: "CHANGE-ME-MANAGED-EXTERNALLY"
    DATABASE_URL: "postgresql://postgres:848St1q9dR@pg-cluster-postgresql-postgresql.default.svc.cluster.local:5432/myai"
  redis:
    REDIS_URL: "redis://default:y590bx4RV7@redis-replication-redis-redis.default.svc.cluster.local:6379/0"
  jwt:
    # 安全加固: 真实 JWT_SECRET 由外部管理(kubectl patch 注入, 见 deploy/scripts/apply-secrets.sh),
    # 此处仅放占位符, 不再把真实密钥提交 git。
    # 注意: helm upgrade 会用此占位值覆盖 Secret → 所有 token 立即失效(fail-closed, 可被立刻发现),
    # 之后必须执行 apply-secrets.sh 重放真实密钥并重启 gateway/auth-service。
    JWT_SECRET: "CHANGE-ME-MANAGED-EXTERNALLY"
    JWT_ISSUER: "myai"
    JWT_AUDIENCE: "myai-users"
    JWT_ACCESS_EXPIRY: "900"
    # gRPC 服务间鉴权共享令牌(审计修复 B2): 真实值由 apply-secrets.sh 注入,
    # 未注入时服务间 gRPC 鉴权不启用(各服务日志告警)。
    GRPC_AUTH_TOKEN: "CHANGE-ME-MANAGED-EXTERNALLY"
  s3:
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
  oss:
    OSS_ACCESS_KEY_ID: ""
    OSS_ACCESS_KEY_SECRET: ""
  hik:
    HIK_URL: ""
    HIK_CLIENT_ID: ""
    HIK_CLIENT_SECRET: ""
    HIK_APP_KEY: ""
    HIK_APP_SECRET: ""
  pay:
    CCB_MERCHANT_ID: ""
    CCB_MERCHANT_NAME: ""
    CCB_TERMINAL_ID: ""
    CCB_KEY: ""
    CCB_CERT: ""
    CCB_GATEWAY_URL: ""
    UMS_MERCHANT_ID: ""
    UMS_TERMINAL_ID: ""
    UMS_KEY: ""
    UMS_GATEWAY_URL: ""
    PAY_NOTIFY_URL: ""
    PAY_RETURN_URL: ""

# =============================================================================
# 其他配置
# =============================================================================
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: false
  annotations: {}
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL
