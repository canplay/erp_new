# =============================================================================
# 敏感信息配置示例
# 
# 警告：此文件包含敏感信息，不要提交到版本控制系统！
# 使用方法：
# 1. 复制此文件为 secrets.yaml
# 2. 填入实际的敏感信息
# 3. 部署时使用 -f secrets.yaml 参数
# =============================================================================

# =============================================================================
# 数据库配置
# =============================================================================
secret:
  database:
    # PostgreSQL 密码
    POSTGRES_PASSWORD: "your-postgres-password"
    # 完整的数据库连接字符串
    # 格式: postgresql://user:password@host:port/database
    DATABASE_URL: "postgresql://myai:your-postgres-password@postgres:5432/myai"

  # Redis 配置
  redis:
    # Redis 连接字符串
    # 格式: redis://[:password@]host:port/db
    REDIS_URL: "redis://redis:6379/0"
    # Redis 密码（可选）
    REDIS_PASSWORD: ""

  # JWT 配置
  jwt:
    # JWT 密钥（至少 32 字符）
    JWT_SECRET: "your-jwt-secret-key-at-least-32-characters-long"
    JWT_ISSUER: "myai"
    JWT_AUDIENCE: "myai-users"
    JWT_ACCESS_EXPIRY: "900"
    JWT_REFRESH_EXPIRY: "604800"

  # S3 配置（如果使用 S3 存储）
  s3:
    S3_ACCESS_KEY: "your-s3-access-key"
    S3_SECRET_KEY: "your-s3-secret-key"

  # OSS 配置（如果使用阿里云 OSS）
  oss:
    OSS_ACCESS_KEY_ID: "your-oss-access-key-id"
    OSS_ACCESS_KEY_SECRET: "your-oss-access-key-secret"

  # 海康威视配置
  hik:
    HIK_URL: "https://your-hik-url"
    HIK_CLIENT_ID: "your-hik-client-id"
    HIK_CLIENT_SECRET: "your-hik-client-secret"
    HIK_APP_KEY: "your-hik-app-key"
    HIK_APP_SECRET: "your-hik-app-secret"

  # 支付配置
  pay:
    # 建行支付配置
    CCB_MERCHANT_ID: "your-ccb-merchant-id"
    CCB_MERCHANT_NAME: "your-ccb-merchant-name"
    CCB_TERMINAL_ID: "your-ccb-terminal-id"
    CCB_KEY: "your-ccb-key"
    CCB_CERT: "your-ccb-cert"
    CCB_GATEWAY_URL: "https://your-ccb-gateway-url"
    
    # 银联商务配置
    UMS_MERCHANT_ID: "your-ums-merchant-id"
    UMS_TERMINAL_ID: "your-ums-terminal-id"
    UMS_KEY: "your-ums-key"
    UMS_GATEWAY_URL: "https://your-ums-gateway-url"
    
    # 支付回调地址
    PAY_NOTIFY_URL: "https://api.example.com/payment/notify"
    PAY_RETURN_URL: "https://api.example.com/payment/return"