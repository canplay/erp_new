# HTTP 客户端
reqwest.workspace = true

# gRPC
tonic.workspace = true
prost.workspace = true

# 公共库
common.workspace = true
auth-core.workspace = true
grpc-proto.workspace = true

[build-dependencies]
tonic-build.workspace = true
prost-build.workspace = true

