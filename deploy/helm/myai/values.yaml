# =============================================================================
# erp_new Helm Chart — 默认配置（开发/测试环境）
# =============================================================================
# 用法:
#   helm install myai ./helm/myai -f ./helm/myai/values.yaml
#   helm install myai ./helm/myai -f ./helm/myai/values-prod.yaml  # 生产
# =============================================================================

# -----------------------------------------------------------------------------
# 全局配置
# -----------------------------------------------------------------------------
global:
  imageRegistry: ""
  imagePullSecrets: []
  envPrefix: ""
  timezone: Asia/Shanghai

# -----------------------------------------------------------------------------
# 镜像配置
# -----------------------------------------------------------------------------
image:
  repository: erp-new-backend
  tag: "latest"
  pullPolicy: IfNotPresent

# -----------------------------------------------------------------------------
# 副本数（开发环境默认 1）
# -----------------------------------------------------------------------------
replicaCount:
  apiGateway: 1
  authService: 1
  userService: 1
  cmsService: 1
  messageService: 1
  fileService: 1
  tenantService: 1
  workflowService: 1
  feedbackService: 1
  auditService: 1
  apiKeyService: 1
  hikService: 1
  payService: 1
  cleanService: 1
  towService: 1
  ctpService: 1
  xltService: 1
  ebikeService: 1
  lprService: 1
  socialOpsService: 1
  browserService: 1
  billingService: 1
  admin: 1

# -----------------------------------------------------------------------------
# 资源限制（开发环境宽松）
# -----------------------------------------------------------------------------
resources:
  apiGateway:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  authService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  userService:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  default:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# -----------------------------------------------------------------------------
# 健康检查
# -----------------------------------------------------------------------------
healthCheck:
  enabled: true
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

# -----------------------------------------------------------------------------
# 服务定义
# -----------------------------------------------------------------------------
services:
  apiGateway:
    enabled: true
    name: api-gateway
    containerName: erp-new-api-gateway
    imageName: erp-new-api-gateway
    ports:
      grpc: 9090
      http: 8090
    service:
      type: ClusterIP
      ports:
        - name: http
          port: 8090
          targetPort: 8090
          protocol: TCP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8090
      GRPC_PORT: 9090
      AUTH_SERVICE_GRPC_URL: auth-service:9091
      USER_SERVICE_GRPC_URL: user-service:9090
      CMS_SERVICE_GRPC_URL: cms-service:9082
      MESSAGE_SERVICE_GRPC_URL: messaging-service:9083
      FILE_SERVICE_GRPC_URL: file-service:9092
      TENANT_SERVICE_GRPC_URL: tenant-service:9095
      WORKFLOW_SERVICE_GRPC_URL: workflow-service:9088
      AUDIT_SERVICE_GRPC_URL: audit-service:9010
      API_KEY_SERVICE_GRPC_URL: api-key-service:9014
      FEEDBACK_SERVICE_GRPC_URL: feedback-service:9085
      HIK_SERVICE_GRPC_URL: hik-service:9096
      PAY_SERVICE_GRPC_URL: pay-service:9097
      CLEAN_SERVICE_GRPC_URL: clean-service:9087
      TOW_SERVICE_GRPC_URL: tow-service:9086
      SOCIAL_OPS_SERVICE_GRPC_URL: social-ops-service:9110
      BROWSER_SERVICE_GRPC_URL: browser-service:9120
      CTP_SERVICE_GRPC_URL: ctp-service:9098
      XLT_SERVICE_GRPC_URL: xlt-service:9099
      EBIKE_SERVICE_GRPC_URL: ebike-service:9100
      LPR_SERVICE_GRPC_URL: lpr-service:9101
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW: 60
      RATE_LIMIT_BURST: 20
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_TIMEOUT_SECS: 60
      CIRCUIT_BREAKER_HALF_OPEN_REQUESTS: 3
      CORS_ALLOWED_ORIGINS: "*"
      CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With"
      CORS_MAX_AGE: 3600

  authService:
    enabled: true
    name: auth-service
    containerName: erp-new-auth-service
    imageName: erp-new-auth-service
    ports:
      grpc: 9091
      http: 8081
    service:
      type: ClusterIP
    env:
      SERVICE_PORT: 8081
      GRPC_PORT: 9091
      JWT_ISSUER: erp-new
      JWT_AUDIENCE: erp-new-users
      JWT_ACCESS_EXPIRY: 900
      JWT_REFRESH_EXPIRY: 604800
      SESSION_MAX_LOGINS: 5
      SESSION_TIMEOUT_SECS: 1800
      DEVICE_LIMIT: 3
      PASSWORD_MIN_LENGTH: 8
      LOGIN_MAX_ATTEMPTS: 5
      LOGIN_LOCKOUT_SECS: 1800

  userService:
    enabled: true
    name: user-service
    containerName: erp-new-user-service
    imageName: erp-new-user-service
    ports:
      grpc: 9090
      http: 8080
    service:
      type: ClusterIP
    env:
      SERVICE_PORT: 8080
      GRPC_PORT: 9090

  cmsService:
    enabled: true
    name: cms-service
    containerName: erp-new-cms-service
    imageName: erp-new-cms-service
    ports:
      grpc: 9082
      http: 8082
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8082
      GRPC_PORT: 9082

  messageService:
    enabled: true
    name: messaging-service
    containerName: erp-new-messaging-service
    imageName: erp-new-messaging-service
    ports:
      grpc: 9083
      http: 8083
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8083
      GRPC_PORT: 9083

  fileService:
    enabled: true
    name: file-service
    containerName: erp-new-file-service
    imageName: erp-new-file-service
    ports:
      grpc: 9092
      http: 8086
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8086
      UPLOAD_BASE_PATH: /data/uploads
      GRPC_PORT: 9092

  tenantService:
    enabled: true
    name: tenant-service
    containerName: erp-new-tenant-service
    imageName: erp-new-tenant-service
    ports:
      grpc: 9095
      http: 8087
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8087
      GRPC_PORT: 9095

  workflowService:
    enabled: true
    name: workflow-service
    containerName: erp-new-workflow-service
    imageName: erp-new-workflow-service
    ports:
      grpc: 9088
      http: 8088
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8088
      GRPC_PORT: 9088

  feedbackService:
    enabled: true
    name: feedback-service
    containerName: erp-new-feedback-service
    imageName: erp-new-feedback-service
    ports:
      grpc: 9085
      http: 8085
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8085
      GRPC_PORT: 9085

  auditService:
    enabled: true
    name: audit-service
    containerName: erp-new-audit-service
    imageName: erp-new-audit-service
    ports:
      grpc: 9010
      http: 8089
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8089
      GRPC_PORT: 9010

  apiKeyService:
    enabled: true
    name: api-key-service
    containerName: erp-new-api-key-service
    imageName: erp-new-api-key-service
    ports:
      grpc: 9014
      http: 8091
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8091
      GRPC_PORT: 9014

  hikService:
    enabled: true
    name: hik-service
    containerName: erp-new-hik-service
    imageName: erp-new-hik-service
    ports:
      grpc: 9096
      http: 8092
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8092
      GRPC_PORT: 9096

  payService:
    enabled: true
    name: pay-service
    containerName: erp-new-pay-service
    imageName: erp-new-pay-service
    ports:
      grpc: 9097
      http: 8093
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8093
      GRPC_PORT: 9097

  cleanService:
    enabled: true
    name: clean-service
    containerName: erp-new-clean-service
    imageName: erp-new-clean-service
    ports:
      grpc: 9087
      http: 8095
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8095
      GRPC_PORT: 9087

  towService:
    enabled: true
    name: tow-service
    containerName: erp-new-tow-service
    imageName: erp-new-tow-service
    ports:
      grpc: 9086
      http: 8094
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8094
      GRPC_PORT: 9086

  ctpService:
    enabled: true
    name: ctp-service
    containerName: erp-new-ctp-service
    imageName: erp-new-ctp-service
    ports:
      grpc: 9098
      http: 8096
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8096
      GRPC_PORT: 9098

  xltService:
    enabled: true
    name: xlt-service
    containerName: erp-new-xlt-service
    imageName: erp-new-xlt-service
    ports:
      grpc: 9099
      http: 8097
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8097
      GRPC_PORT: 9099

  ebikeService:
    enabled: true
    name: ebike-service
    containerName: erp-new-ebike-service
    imageName: erp-new-ebike-service
    ports:
      grpc: 9100
      http: 8098
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8098
      GRPC_PORT: 9100

  lprService:
    enabled: true
    name: lpr-service
    containerName: erp-new-lpr-service
    imageName: erp-new-lpr-service
    ports:
      grpc: 9101
      http: 8099
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8099
      GRPC_PORT: 9101

  socialOpsService:
    enabled: true
    name: social-ops-service
    containerName: erp-new-social-ops-service
    imageName: erp-new-social-ops-service
    ports:
      grpc: 9110
      http: 8110
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8110
      GRPC_PORT: 9110

  browserService:
    enabled: true
    name: browser-service
    containerName: erp-new-browser-service
    imageName: erp-new-browser-service
    ports:
      grpc: 9120
      http: 8120
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8120
      GRPC_PORT: 9120

  billingService:
    enabled: true
    name: billing-service
    containerName: erp-new-billing-service
    imageName: erp-new-billing-service
    ports:
      grpc: 9101
      http: 8088
    service:
      type: ClusterIP
    healthCheck:
      enabled: true
    env:
      SERVICE_PORT: 8088
      GRPC_PORT: 9101

  admin:
    enabled: true
    name: erp-new-admin
    containerName: erp-new-admin
    imageName: erp-new-admin
    tag: "latest"
    ports:
      http: 80
      grpc: 0
    service:
      type: ClusterIP
      ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
    env:
      SERVICE_PORT: "80"
      VITE_API_BASE_URL: "http://localhost:8090/api"
    healthCheck:
      enabled: true
    securityContext:
      readOnlyRootFilesystem: false
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - CHOWN
          - NET_BIND_SERVICE
          - SETUID
          - SETGID
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000

# -----------------------------------------------------------------------------
# Ingress（开发环境禁用）
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  baseDomain: "localhost"
  tlsSecretName: tls
  annotations: {}
  hosts: []
  tls: []
  sslipPorts: {}

# -----------------------------------------------------------------------------
# ConfigMap（非敏感配置）
# -----------------------------------------------------------------------------
configMap:
  logging:
    RUST_LOG: debug
    LOG_FORMAT: json
    LOG_MAX_SIZE: "100"
    LOG_MAX_FILES: "7"
  otel:
    OTEL_ENABLED: "false"
    OTEL_SERVICE_NAME: erp-new-backend
  databasePool:
    maxConnections: "3"
    minConnections: "1"
    connectTimeout: "30"
    idleTimeout: "300"
    maxLifetime: "1800"
  meilisearch:
    MEILISEARCH_URL: "http://meilisearch:7700"
    MEILISEARCH_INDEX_PREFIX: "erp_new"

# -----------------------------------------------------------------------------
# Secret（敏感配置 — 占位符，生产环境通过外部注入）
# -----------------------------------------------------------------------------
secret:
  database:
    POSTGRES_PASSWORD: "CHANGE-ME"
    DATABASE_URL: "postgresql://postgres:postgres@erp-new-postgres:5432/erp_new"
  redis:
    REDIS_URL: "redis://erp-new-redis:6379/0"
  meilisearch:
    MEILI_MASTER_KEY: "CHANGE-ME"
  jwt:
    JWT_SECRET: "CHANGE-ME-MIN-32-CHARS-REPLACE-IN-PRODUCTION"
    JWT_ISSUER: "erp-new"
    JWT_AUDIENCE: "erp-new-users"
    JWT_ACCESS_EXPIRY: "900"
    GRPC_AUTH_TOKEN: "CHANGE-ME"
  s3:
    S3_ACCESS_KEY: ""
    S3_SECRET_KEY: ""
  oss:
    OSS_ACCESS_KEY_ID: ""
    OSS_ACCESS_KEY_SECRET: ""
  hik:
    HIK_URL: ""
    HIK_CLIENT_ID: ""
    HIK_CLIENT_SECRET: ""
    HIK_APP_KEY: ""
    HIK_APP_SECRET: ""
  pay:
    CCB_MERCHANT_ID: ""
    CCB_MERCHANT_NAME: ""
    CCB_TERMINAL_ID: ""
    CCB_KEY: ""
    CCB_CERT: ""
    CCB_GATEWAY_URL: ""
    UMS_MERCHANT_ID: ""
    UMS_TERMINAL_ID: ""
    UMS_KEY: ""
    UMS_GATEWAY_URL: ""
    PAY_NOTIFY_URL: ""
    PAY_RETURN_URL: ""

# -----------------------------------------------------------------------------
# 基础设施（开发环境启用内部 PG + Redis）
# -----------------------------------------------------------------------------
infrastructure:
  postgres:
    enabled: true
    image: postgres:18.6-alpine
    containerName: erp-new-postgres
    ports:
      - 5432
    env:
      POSTGRES_DB: erp_new
      POSTGRES_USER: postgres
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  redis:
    enabled: true
    image: redis:8.8.2-alpine
    containerName: erp-new-redis
    ports:
      - 6379
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: erp-new-service-account
  annotations: {}

# -----------------------------------------------------------------------------
# Pod / Container Security Context
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop:
      - ALL

# -----------------------------------------------------------------------------
# 调度
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}

# -----------------------------------------------------------------------------
# 监控
# -----------------------------------------------------------------------------
monitoring:
  enabled: false
  scrapeInterval: "30s"
  scrapeTimeout: "10s"

# -----------------------------------------------------------------------------
# OpenTelemetry
# -----------------------------------------------------------------------------
otel:
  enabled: false
  exporterOtlpEndpoint: ""
  serviceName: erp-new-backend

# -----------------------------------------------------------------------------
# 日志
# -----------------------------------------------------------------------------
logging:
  level: debug
  format: json
  maxSize: 100
  maxFiles: 7

# -----------------------------------------------------------------------------
# Meilisearch 全文搜索
# -----------------------------------------------------------------------------
infrastructure:
  meilisearch:
    enabled: true
    env:
      MEILI_ENV: development
      MEILI_EXPERIMENTAL_REPLICATION: "false"
